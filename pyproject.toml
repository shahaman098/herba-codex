[project]
name = "herba-codex"
version = "0.1.0"
description = "Herba Codex: an agentic pipeline mapping historical herbal texts to modern pharmacological evidence, with provenance on every claim."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Team Herba Codex" }]
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.3",
    "numpy>=1.26",
]

[project.scripts]
herba = "herbacodex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herbacodex"]
